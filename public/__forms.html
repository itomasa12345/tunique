<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>お問い合わせフォームの登録情報 | TUNIQUE</title></head>
<body>
<form name="tunique-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="tunique-contact">
  <input name="bot-field">
  <input name="name" type="text">
  <input name="email" type="email">
  <input name="type" type="text">
  <input name="region" type="text">
  <textarea name="message"></textarea>
  <input name="consent" type="text">
</form>
<p>お問い合わせは<a href="/contact">こちらのページ</a>からお願いします。</p>
</body>
</html>
